<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
<script src="script.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <H1>My Library</H1>
            <button class="addBook" type="submit">Add New Book</button>
        </div>
        <div class="modal hidden">
            <form class="bookForm" action="" method="post">
                <h2>Enter a new book</h2>
                <label for="titleInput">Title:</label>
                <input type="text" name="titleInput" id="titleInput" placeholder="War and Peace" required/>
                <span class="error" aria-live="polite"></span>
                <label for="authorInput">Author:</label>
                <input type="text" name="authorInput" id="authorInput" placeholder="Lev Nikolajevič Tolstoj" required/>
                <span class="error" aria-live="polite"></span>
                <label for="pagesInput">Number of pages:</label>
                <input type="number" name="pagesInput" id="pagesInput" placeholder="1200" required/>
                <span class="error" aria-live="polite"></span>
                <h3>Have you read it?</h3>
                <div class="radioRow">
                    <label for="readInputYes">Yes</label>
                    <input type="radio" name="readInput" id="readInputYes" value="Yes" required/>
                </div>
                <div class="radioRow">
                    <label for="readInputNo">No</label>
                    <input type="radio" name="readInput" id="readInputNo" value="" required/>
                </div>    
                <div class="formButtonsRow">
                    <button class="formSubmit">Add book to library</button>
                    <button class="formCancel" type="reset">Cancel</button>
                </div>
            </form>
        </div>
        <div class="content">
        </div>
    </div>
</body>
</html>
